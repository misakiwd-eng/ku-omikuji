<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Ku's Good Luck Charm</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    -webkit-text-size-adjust:100%;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:#F8F6F2;

    padding:24px;

    font-family:
    "Inter",
    "Noto Sans JP",
    sans-serif;

    color:#333;

}

.card{

    width:min(100%,430px);

    background:#fff;

    border-radius:26px;

    padding:38px 30px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.08);

}

.center{

    text-align:center;

}

.hidden{

    display:none;

}

.fade{

    animation:fade .35s ease;

}

@keyframes fade{

from{

    opacity:0;

    transform:translateY(14px);

}

to{

    opacity:1;

    transform:translateY(0);

}

}

h1{

    font-size:54px;

    margin-bottom:12px;

}

h2{

    font-size:28px;

    font-weight:700;

    margin-bottom:10px;

}

h3{

    font-size:18px;

    font-weight:600;

    margin-bottom:12px;

}

.small{

    color:#777;

    font-size:.9rem;

}

.section{

    margin-top:26px;

    padding-top:20px;

    border-top:1px solid #ECECEC;

}

button{

    width:100%;

    margin-top:28px;

    padding:16px;

    border:none;

    border-radius:999px;

    background:#4A6FA5;

    color:#fff;

    font-size:17px;

    cursor:pointer;

    transition:.2s;

    -webkit-tap-highlight-color:transparent;

}

button:hover{

    transform:translateY(-2px);

    box-shadow:
        0 8px 20px rgba(74,111,165,.25);

}

button:active{

    transform:scale(.98);

}

#letterButton{

    background:#fff;

    color:#4A6FA5;

    border:2px solid #4A6FA5;

}

.loading{

    text-align:center;

    color:#666;

    padding:40px 0;

}

.link{

    display:block;

    margin-top:28px;

    text-align:center;

    color:#4A6FA5;

    text-decoration:none;

    font-weight:600;

    cursor:pointer;

}

#fortuneText,
#bonusText,
#letterText{

    white-space:pre-wrap;

    line-height:1.8;

}

</style>

</head>

<body>

<div class="card">
    <!-- Home -->

    <div
        id="home"
        class="center fade">

        <h1>🍀</h1>

        <h2>
            Ku's Good Luck Charm
        </h2>

        <p class="small">
            A little surprise for today.
        </p>

        <button
            onclick="drawFortune()">

            Open Your Fortune

        </button>

    </div>

    <!-- Loading -->

    <div
        id="loading"
        class="hidden loading">

        ✨

        <br><br>

        Finding today's fortune...

        <br>

        今日の運勢を探しています...

    </div>

    <!-- Fortune -->

    <div
        id="fortune"
        class="hidden">

        <h2 id="greeting"></h2>

        <div class="section">

            <h3>

                Today's Fortune

                <br>

                <span class="small">
                    今日の運勢
                </span>

            </h3>

            <p id="fortuneText"></p>

        </div>

        <div class="section">

            <h3 id="bonusTitle"></h3>

            <p id="bonusText"></p>

        </div>

        <div class="section center">

            <button
                id="letterButton"
                onclick="showLetter()">

                💌

                <br><br>

                A letter is waiting.

                <br>

                <span class="small">

                    手紙が届いています。

                </span>

            </button>

        </div>

    </div>
        <!-- Letter -->

    <div
        id="letter"
        class="hidden">

        <h2>

            💌 A Letter

            <br>

            <span class="small">

                手紙

            </span>

        </h2>

        <div class="section">

            <p id="letterText"></p>

            <p
                id="sender"
                style="
                    text-align:right;
                    font-weight:600;
                    margin-top:20px;
                ">
            </p>

        </div>

        <a
            class="link"
            onclick="goHome()">

            Open another fortune

            <br>

            もう一度ひく

        </a>

    </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyTXGD27EeamDLXpj-Su7c27RkSaRY4AjVoUFeap-bjQGca4dEqZnwBEltm6dVnGR8iWg/exec";

const greetings = [

    "✨ Something good is waiting.",

    "🌿 Today looks promising.",

    "🍀 Trust today.",

    "☀️ A beautiful day begins.",

    "💫 A little luck goes a long way.",

    "🌸 You've got this."

];

let currentFortune = null;

function translate(title){

    switch(title){

        case "Today's Challenge":
            return "今日のチャレンジ";

        case "Today's Keyword":
            return "今日のキーワード";

        case "Watch Out!":
            return "気をつけて";

        default:
            return "";

    }

}
async function drawFortune(){

    const home = document.getElementById("home");
    const loading = document.getElementById("loading");
    const fortune = document.getElementById("fortune");

    const greeting = document.getElementById("greeting");
    const fortuneText = document.getElementById("fortuneText");
    const bonusTitle = document.getElementById("bonusTitle");
    const bonusText = document.getElementById("bonusText");

    home.classList.add("hidden");
    loading.classList.remove("hidden");

    try{

        const response = await fetch(
            API_URL + "?t=" + Date.now(),
            {
                method: "GET",
                cache: "no-store"
            }
        );

        if(!response.ok){
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if(!Array.isArray(data) || data.length === 0){
            throw new Error("No data found.");
        }

        currentFortune =
            data[Math.floor(Math.random() * data.length)];

        await new Promise(resolve =>
            setTimeout(resolve, 300)
        );

        loading.classList.add("hidden");

        greeting.textContent =
            greetings[Math.floor(Math.random() * greetings.length)];

        fortuneText.textContent =
            currentFortune.fortune || "";

        bonusTitle.innerHTML =
            currentFortune.bonusTitle +
            "<br><span class='small'>" +
            translate(currentFortune.bonusTitle) +
            "</span>";

        bonusText.textContent =
            currentFortune.bonusText || "";

        fortune.classList.remove("hidden");
        fortune.classList.remove("fade");
        void fortune.offsetWidth;
        fortune.classList.add("fade");

    }catch(err){

        console.error(err);

        loading.classList.add("hidden");
        home.classList.remove("hidden");

        alert(
            "読み込みに失敗しました。\n\n" +
            err.message
        );

    }

}
function showLetter(){

    const fortune = document.getElementById("fortune");
    const letter = document.getElementById("letter");
    const letterText = document.getElementById("letterText");
    const sender = document.getElementById("sender");

    fortune.classList.add("hidden");

    letterText.textContent =
        currentFortune.letter || "";

    sender.textContent =
        currentFortune.name
        ? "— " + currentFortune.name
        : "";

    letter.classList.remove("hidden");
    letter.classList.remove("fade");
    void letter.offsetWidth;
    letter.classList.add("fade");

}

function goHome(){

    document.getElementById("letter").classList.add("hidden");
    document.getElementById("fortune").classList.add("hidden");
    document.getElementById("loading").classList.add("hidden");

    const home = document.getElementById("home");

    home.classList.remove("hidden");
    home.classList.remove("fade");
    void home.offsetWidth;
    home.classList.add("fade");

}

document.addEventListener("keydown",(e)=>{

    if(e.key==="Escape"){
        goHome();
    }

});

window.addEventListener("pageshow",()=>{

    document.getElementById("loading").classList.add("hidden");

    if(
        document.getElementById("home").classList.contains("hidden") &&
        document.getElementById("fortune").classList.contains("hidden") &&
        document.getElementById("letter").classList.contains("hidden")
    ){
        document.getElementById("home").classList.remove("hidden");
    }

});

</script>

</body>

</html>
