<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ku's Good Luck Charm</title>

<style>
body{
    margin:0;
    background:#f8f4ed;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    width:90%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.1);
    text-align:center;
}

button{
    padding:14px 28px;
    border:none;
    border-radius:999px;
    font-size:18px;
    cursor:pointer;
}

#result{
    margin-top:25px;
    text-align:left;
}
</style>

</head>

<body>

<div class="card">

<h1>🍀 Ku's Good Luck Charm</h1>

<p>May today bring you something wonderful.</p>

<button onclick="drawFortune()">
Draw a Fortune
</button>

<div id="result"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbyTXGD27EeamDLXpj-Su7c27RkSaRY4AjVoUFeap-bjQGca4dEqZnwBEltm6dVnGR8iWg/exec";

async function drawFortune(){

    const response = await fetch(API_URL);
    const data = await response.json();

    const fortune = data[Math.floor(Math.random()*data.length)];

    document.getElementById("result").innerHTML = `
        <h2>🌸 Great Blessing 🌸</h2>

        <h3>Today's Fortune</h3>
        <p>${fortune.fortune}</p>

        <h3>${fortune.bonusTitle}</h3>
        <p>${fortune.bonusText}</p>

        <h3>A Letter for Later</h3>
        <p>${fortune.letter}</p>

        <p><strong>— ${fortune.name}</strong></p>
    `;
}

</script>

</body>
</html>
